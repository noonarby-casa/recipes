{{- with resources.Get "dist/meal-planner.js" }}
  {{- if eq hugo.Environment "development" }}
    <script src="{{ .RelPermalink }}?v={{ now.UnixNano }}" defer></script>
  {{- else }}
    {{- $fingerprinted := . | resources.Fingerprint "sha256" }}
    <script
      src="{{ $fingerprinted.RelPermalink }}"
      integrity="{{ $fingerprinted.Data.Integrity }}"
      defer
      crossorigin="anonymous"
    ></script>
  {{- end }}
{{- end }}
